name: ms_calculator
description: "MS Calculator - calculators and converters"
version: 1.7.2+72
publish_to: 'none'

environment:
  sdk: '>=3.1.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  provider: ^6.1.1
  intl: ^0.19.0
  math_expressions: ^2.4.0
  url_launcher: ^6.2.5
  share_plus: ^10.0.0
  package_info_plus: ^8.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/MS Calculator.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
